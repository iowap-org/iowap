name: Security & Dependency Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # Weekly on Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit & safety
        run: pip install pip-audit safety

      - name: Audit dependencies with pip-audit
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          else
            echo "No requirements.txt found — skipping pip-audit"
          fi

      - name: Check for known vulnerabilities with safety
        run: |
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt --full-report
          else
            echo "No requirements.txt found — skipping safety check"
          fi

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        uses: jaxxstorm/action-install-gh-release@v1.12.0
        with:
          repo: gitleaks/gitleaks
          tag: v8.27.2
          cache: enable

      - name: Run Gitleaks
        run: gitleaks detect --source . --git-log-opts="--all" --redact --exit-code 1

  code-security:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
